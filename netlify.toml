[build]
  # NOTE: the Netlify UI for this site sets the build command to `npm run build:production`, and the
  # UI value overrides this block. Kept in sync so this file stops disagreeing with what actually runs.
  command = "npm run build:production"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/banking/proxy"
  to = "/.netlify/functions/banking-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/embedded-finance/virtual-cards"
  to = "/.netlify/functions/embedded-finance-virtual-cards"
  status = 200
  force = true

[[redirects]]
  from = "/embedded-finance/virtual-cards/*"
  to = "/.netlify/functions/embedded-finance-virtual-cards/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # react-native@0.81.5 declares engines.node ">= 20.19.4", and metro-config calls
  # Array.prototype.toReversed (ES2023), which does not exist on Node 18. On Node 18 the build dies
  # before bundling with: TypeError: configs.toReversed is not a function
  # 22 matches the Node version the Vercel project for this app already runs.
  #
  # The block that used to sit here ([template.environment]) carried placeholder values like
  # "Your Supabase URL" — a trap for any context that ever picked it up. Removed.
  NODE_VERSION = "22"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for all paths
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.stripe.com js.stripe.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.lanonasis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.supabase.co https://api.stripe.com https://*.lanonasis.com https://*.vercel.app; frame-src https://js.stripe.com https://hooks.stripe.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://js.stripe.com https://hooks.stripe.com https://*.lanonasis.com; object-src 'none'; report-uri https://o{SENTRY_ORG_ID}.ingest.sentry.io/api/{SENTRY_PROJECT_ID}/csp-report/"
    # NOTE: Replace {SENTRY_ORG_ID} and {SENTRY_PROJECT_ID} with actual values.
    # Derive from DSN: https://{key}@o{org_id}.ingest.sentry.io/{project_id}
    # Then: report-uri = https://o{org_id}.ingest.sentry.io/api/{project_id}/csp-report/
