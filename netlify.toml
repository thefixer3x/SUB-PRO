[build]
  # NOTE: the Netlify UI for this site sets the build command to `npm run build:production`, and the
  # UI value overrides this block. Kept in sync so this file stops disagreeing with what actually runs.
  command = "npm run build:production"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/banking/proxy"
  to = "/.netlify/functions/banking-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/embedded-finance/virtual-cards"
  to = "/.netlify/functions/embedded-finance-virtual-cards"
  status = 200
  force = true

[[redirects]]
  from = "/embedded-finance/virtual-cards/*"
  to = "/.netlify/functions/embedded-finance-virtual-cards/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/stripe/webhook"
  to = "/.netlify/functions/stripe-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # react-native@0.81.5 declares engines.node ">= 20.19.4", and metro-config calls
  # Array.prototype.toReversed (ES2023), which does not exist on Node 18. On Node 18 the build dies
  # before bundling with: TypeError: configs.toReversed is not a function
  # 22 matches the Node version the Vercel project for this app already runs.
  #
  # The block that used to sit here ([template.environment]) carried placeholder values like
  # "Your Supabase URL" — a trap for any context that ever picked it up. Removed.
  NODE_VERSION = "22"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
