name: Performance Budget

# Fails a PR that grows the web bundle past perf-budget.json or drops the
# Lighthouse scores below the floors in lighthouserc.json. Both files record
# today's baseline; tighten them as the app gets faster (see
# docs/agents/BLUEPRINT_SCORE.md, performance budgets).

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: perf-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  budget:
    runs-on: ubuntu-latest
    name: Bundle size + Lighthouse
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Placeholder public values only: the bundle size does not depend on
      # them, and the Lighthouse run measures the signed-out landing page.
      - name: Export web build
        env:
          NODE_ENV: production
          EXPO_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
        run: npx expo export --platform web --output-dir dist

      - name: Check bundle budget
        run: npm run check:bundle

      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.14.0 autorun

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
