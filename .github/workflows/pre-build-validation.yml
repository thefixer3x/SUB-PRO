name: Pre-Build Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate Before EAS Build
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          # Throwaway CI database on localhost only: trust auth, so no password
          # literal lives in the repo.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        
      - name: Setup Node.js
        uses: actions/setup-node@60edb5dd545a775178f52524783378180af0d1f8
        with:
          node-version: 20
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci

      - name: Validate Supabase migration names
        run: npm run check-migrations

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test P0 baseline and webhook migrations
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
        run: npm run test:migrations
        
      - name: TypeScript Check
        run: npm run type-check
        
      - name: Lint Check
        run: npm run lint
        continue-on-error: false
        
      - name: Test Metro Bundle (Android)
        run: npx expo export --platform android --dev --output-dir ./test-dist
        
      - name: Test Metro Bundle (iOS)  
        run: npx expo export --platform ios --dev --output-dir ./test-dist
        
      - name: Validate App Config
        run: |
          echo "🔍 Validating app.json configuration..."
          npx expo config --type public
          
      - name: Check Required Secrets
        run: |
          echo "🔐 Checking if required secrets are available in production..."
          # This will fail if secrets are missing when triggered on main branch
          if [ "$GITHUB_REF" == "refs/heads/main" ]; then
            echo "Production build validation - checking secrets..."
            if [ -z "${{ secrets.EAS_ROBOT_TOKEN }}" ]; then
              echo "❌ EAS_ROBOT_TOKEN missing"
              exit 1
            fi
            if [ -z "${{ secrets.ADMOB_APP_ID }}" ]; then
              echo "❌ ADMOB_APP_ID missing"  
              exit 1
            fi
            echo "✅ Required secrets present"
          fi
          
      - name: Check Bundle Size
        run: |
          echo "📊 Checking bundle sizes..."
          du -sh test-dist/* || echo "No bundles to check"
          
      - name: Cleanup
        run: rm -rf test-dist
