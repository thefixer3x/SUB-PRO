name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Prevent parallel runs for the same issue/PR
concurrency:
  group: claude-${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Required by claude-code-action: it exchanges an OIDC token for the
      # Claude GitHub App token. Grants no repository access by itself.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Pinned to the v1 release commit for supply-chain integrity
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          
          claude_args: >-
            --allowedTools Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)
            --append-system-prompt "Follow the project's coding standards. Ensure all new code has tests. Use TypeScript for new files."

