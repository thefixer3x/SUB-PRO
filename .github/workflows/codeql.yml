# CodeQL analysis — runs weekly + on push to main
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run weekly on Monday at 06:00 AEST
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]

    steps:
      - name: Checkout repository
        uses: actions/checkout@b4ffde65f46336ab88eb53be808476332228c1c1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6bb031af984275dc87f5ff61f3893811e476a686
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@6bb031af984275dc87f5ff61f3893811e476a686

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6bb031af984275dc87f5ff61f3893811e476a686
        with:
          category: "/language:${{ matrix.language }}"
